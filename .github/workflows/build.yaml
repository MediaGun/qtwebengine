name: Build library
run-name: Build library by ${{ github.actor }}

on:
  push:
    branches:
      - master
      - test
      - qt-6.8
      - qt-6.12
    tags:
      - 'v*'
      - 'qt-*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  packages: write

env:
  qt_version: 6.12.0
  # aqtinstall 3.3.0, the latest release, can't install Qt 6.11+ on Windows ("Failed to locate XML
  # data for Qt version"): it doesn't know the per-architecture repository folders. Its master
  # does; pinned to a commit until a release has it.
  aqt_source: git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7
  # Since Qt 6.12, Qt WebEngine is versioned on its own (Chromium 140 -> 6.140.0), and it isn't in
  # qt5's v6.12.0 any more: Qt 6.12.0 ships Qt WebEngine and Qt Pdf 6.140.0. This is its release
  # branch (the 6.8 build used the 6.8.0 branch the same way).
  qt_checkout_tag: 6.140.0
  # Qt's GitHub mirror: faster and more reliable from GitHub's runners than code.qt.io. The
  # Chromium submodule's URL is relative, so it comes from the mirror too.
  qtwebengine_repo: https://github.com/qt/qtwebengine.git
  # The same on every platform. Only what the app uses is built (Qt WebEngine Core and Quick, Qt
  # Pdf and Pdf Quick), which also keeps the build shorter, within GitHub's 6 hours per job.
  build_options: >-
    -webengine-proprietary-codecs
    -webengine-pepper-plugins
    -no-feature-qtwebengine-widgets-build
    -no-feature-qtpdf-widgets-build
    -no-feature-webengine-developer-build
    -no-feature-webengine-full-debug-info
    -no-feature-webengine-spellchecker
    -no-feature-webengine-extensions
    -no-feature-webenginedriver
  build_type_option: "" # "-DCMAKE_BUILD_TYPE=Release"
  # Qt 6.12 needs CMake 3.25 or newer; Qt WebEngine 6.140 needs Node.js 20 or newer.
  cmake_version: '3.31.6'
  node_version: '20'
  python_version: '3.12'

jobs:
  build_linux:
    name: Build for Linux
    runs-on: [ ubuntu-24.04 ]
    # The maximum for GitHub-hosted runners.
    timeout-minutes: 360

    env:
      build_dir: '${{ github.workspace }}/build'
      install_prefix: '${{ github.workspace }}/install_linux'

    steps:
      # Chromium's sources and build need far more space than the runner leaves free.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison build-essential flex git gperf \
            libasound2-dev libatspi2.0-dev libavcodec-dev libavformat-dev libavutil-dev libcups2-dev libgbm-dev \
            libdbus-1-dev libdrm-dev libegl1-mesa-dev libevent-dev libfontconfig1-dev libfreetype6-dev libicu-dev libjsoncpp-dev libminizip-dev \
            libnss3-dev libopus-dev libpci-dev libprotobuf-dev libpulse-dev libre2-dev libsnappy-dev libsrtp2-dev libssl-dev libudev-dev libvpx-dev \
            libwebp-dev libx11-dev libx11-xcb-dev libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev libxcb-sync0-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxcb-xkb-dev libxcb1-dev libxcomposite-dev libxcursor-dev libxdamage-dev libxext-dev libxfixes-dev libxi-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxkbfile-dev libxrandr-dev libxrender-dev libxshmfence-dev libxss-dev libxtst-dev \
            ninja-build protobuf-compiler

      - name: Install node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node_version }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtsource: ${{ env.aqt_source }}
          version: ${{ env.qt_version }}
          dir: ${{ runner.temp }}/qt
          tools: 'tools_ninja'
          modules: 'qtshadertools'

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.cmake_version }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python_version }}

      - name: Install python modules
        run: pip install html5lib

      - name: Get QtWebEngine sources
        run: |
          git clone --depth 1 --branch ${{ env.qt_checkout_tag }} ${{ env.qtwebengine_repo }} qt/qtwebengine
          cd qt/qtwebengine
          git submodule update --init --recursive --depth 1

      - name: Configure QtWebEngine
        run: |
          mkdir -p ${{ env.build_dir }} && cd ${{ env.build_dir }}

          ${{ env.QT_ROOT_DIR }}/bin/qt-configure-module ${{ github.workspace }}/qt/qtwebengine ${{ env.build_options }} -- ${{ env.build_type_option }} -DCMAKE_INSTALL_PREFIX=${{ env.install_prefix }}

      - name: Build QtWebEngine
        working-directory: ${{ env.build_dir }}
        run: |
          cmake --build . --parallel
          cmake --install .

      - name: 'Tar files (to preserve symlinks)'
        run: tar -cvf qtwebengine.tar -C ${{ env.install_prefix }} .

      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          name: qtwebengine-linux
          path: qtwebengine.tar

  build_windows:
    name: Build for Windows
    # windows-2022: Visual Studio 2022, as Qt's msvc2022_64 binaries and the app. windows-2025 has
    # Visual Studio 2026, whose DLLs need a newer C++ runtime than the app ships.
    runs-on: [ windows-2022 ]
    # The maximum for GitHub-hosted runners.
    timeout-minutes: 360

    env:
      # Short paths on the runner's D: drive: Chromium's paths are long.
      checkout_dir: 'D:\qtwe\src'
      build_dir: 'D:\qtwe\build'
      install_prefix: 'D:\qtwe\install'
      qt_dir: 'D:\opt'

    steps:
      - name: Prepare environment
        shell: pwsh
        run: |
          $p = "HKLM:\System\CurrentControlSet\Control\Filesystem"
          Set-ItemProperty $p LongPathsEnabled 1
          git config --global core.longpaths true

          New-Item -ItemType Directory -Force ${{ env.checkout_dir }}, ${{ env.build_dir }}

      - name: Prepare tools
        run: |
          perl -v
          choco install -y gperf winflexbison3

      # The runner's MSVC (cl.exe and its environment) for all the steps below.
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node_version }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtsource: ${{ env.aqt_source }}
          version: ${{ env.qt_version }}
          arch: 'win64_msvc2022_64'
          dir: ${{ env.qt_dir }}
          tools: 'tools_ninja'
          modules: 'qtshadertools'

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Setup Cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.cmake_version }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python_version }}

      - name: Install python modules
        run: pip install html5lib

      - name: Get QtWebEngine sources
        working-directory: ${{ env.checkout_dir }}
        run: |
          git clone --depth 1 --branch ${{ env.qt_checkout_tag }} ${{ env.qtwebengine_repo }} .
          git submodule update --init --recursive --depth 1

      - name: Configure QtWebEngine
        shell: cmd
        working-directory: ${{ env.build_dir }}
        run: |
          ${{ env.QT_ROOT_DIR }}\bin\qt-configure-module.bat ${{ env.checkout_dir }} ${{ env.build_options }} -- ${{ env.build_type_option }} -DCMAKE_INSTALL_PREFIX=${{ env.install_prefix }}

      - name: Build QtWebEngine
        shell: cmd
        working-directory: ${{ env.build_dir }}
        run: |
          cmake --build . --parallel
          cmake --install .

      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          name: qtwebengine-windows
          path: ${{ env.install_prefix }}

  build_macos:
    name: Build for MacOS
    runs-on: [ macos-26 ]
    # The maximum for GitHub-hosted runners.
    timeout-minutes: 360

    env:
      build_dir: '${{ github.workspace }}/build'
      install_prefix: '${{ github.workspace }}/install_macos'

    steps:
      - name: Prepare libraries
        run: |
          brew install gperf bison flex

      # Qt WebEngine 6.140 compiles Metal shaders: "Build requires Metal Toolchain to be installed
      # via 'xcodebuild -downloadComponent MetalToolchain'".
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Install node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node_version }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtsource: ${{ env.aqt_source }}
          version: ${{ env.qt_version }}
          dir: ${{ runner.temp }}/qt
          tools: 'tools_ninja'
          modules: 'qtshadertools'

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.cmake_version }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python_version }}

      - name: Install python modules
        run: pip install html5lib

      - name: Get QtWebEngine sources
        run: |
          git clone --depth 1 --branch ${{ env.qt_checkout_tag }} ${{ env.qtwebengine_repo }} qt/qtwebengine
          cd qt/qtwebengine
          git submodule update --init --recursive --depth 1

      - name: Configure QtWebEngine
        run: |
          mkdir -p ${{ env.build_dir }} && cd ${{ env.build_dir }}

          ${{ env.QT_ROOT_DIR }}/bin/qt-configure-module ${{ github.workspace }}/qt/qtwebengine ${{ env.build_options }} -- ${{ env.build_type_option }} -DCMAKE_INSTALL_PREFIX=${{ env.install_prefix }}

      - name: Build QtWebEngine
        working-directory: ${{ env.build_dir }}
        run: |
          cmake --build . --parallel
          cmake --install .

      - name: 'Tar files (to preserve symlinks)'
        run: tar -cvf qtwebengine.tar -C ${{ env.install_prefix }} .

      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          name: qtwebengine-macos
          path: qtwebengine.tar

  # On a tag (e.g. v6.140.0): a GitHub release with one zip per platform, laid out as the app's
  # build.yaml downloads them: qtwebengine-windows.zip has the install folder's contents, to be
  # extracted into Qt; the Linux and macOS zips hold qtwebengine.tar, which keeps the symlinks.
  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [ build_linux, build_windows, build_macos ]
    runs-on: [ ubuntu-24.04 ]
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        working-directory: artifacts
        run: |
          for platform in linux windows macos; do
            (cd qtwebengine-$platform && zip -r -y ../../qtwebengine-$platform.zip .)
          done
          ls -la ..

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Qt WebEngine ${{ env.qt_checkout_tag }} for Qt ${{ env.qt_version }} (${{ github.ref_name }})
          body: |
            Qt WebEngine and Qt Pdf ${{ env.qt_checkout_tag }}, built against Qt ${{ env.qt_version }} for Linux, Windows and macOS.
          files: qtwebengine-*.zip
